name: Release

on:
  push:
    branches: ["master", "test"]
  pull_request:
    branches: ["master", "test"]
  workflow_dispatch:

# Build jobs only read the repository. The Release job alone gets write access.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (repository policy); the tag is in the comment.

jobs:
  Windows:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        ARCH: ["i686", "x86_64"]
        BUILD_TYPE: ["debug", "release"]
        DISCORD_INTEGRATION: ["using discord", "not using discord"]

    env:
      BUILD: ${{ github.run_number }}
      TRIPLE: ${{ matrix.ARCH }}-w64-mingw32
      # Debian package suffix and the file name suffix used for side-by-side installs.
      PKG_ARCH: ${{ matrix.ARCH == 'x86_64' && 'x86-64' || 'i686' }}
      SUFFIX: ${{ matrix.ARCH == 'x86_64' && 'x64' || 'x86' }}
      dev: ${{ matrix.BUILD_TYPE == 'debug' && '_dev' || '' }}
      cmd: ${{ matrix.BUILD_TYPE == 'release' && '--release-build --strip-binary' || '' }}
      discord: ${{ matrix.DISCORD_INTEGRATION == 'using discord' && '--with-discord' || '' }}
      discord_tag: ${{ matrix.DISCORD_INTEGRATION == 'using discord' && '_discord' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y "binutils-mingw-w64-${PKG_ARCH}" "gcc-mingw-w64-${PKG_ARCH}" "g++-mingw-w64-${PKG_ARCH}" yasm python3-pip python-is-python3
          pip3 install meson ninja

      - name: Env setup
        run: |
          echo "Build number ${BUILD} for ${TRIPLE}"
          mkdir -p ciout
          echo "ZIP_NAME=onscripter-ru_win_${SUFFIX}_r${BUILD}${dev}${discord_tag}" >> "$GITHUB_ENV"

      - name: Configure
        env:
          CC: ${{ env.TRIPLE }}-gcc
          CXX: ${{ env.TRIPLE }}-g++
          LD: ${{ env.TRIPLE }}-ld
          AR: ${{ env.TRIPLE }}-ar
          RANLIB: ${{ env.TRIPLE }}-ranlib
          AS: ${{ env.TRIPLE }}-as
        run: ./configure "--cross=${TRIPLE}" ${{env.cmd}} ${{env.discord}}

      - name: Build
        run: |
          make clean
          make -j"$(nproc)"
          files=("onscripter-ru_${SUFFIX}.exe")
          mv "DerivedData/MinGW-${{ matrix.ARCH }}/onscripter-ru.exe" "ciout/onscripter-ru_${SUFFIX}.exe"
          if [ -n "${{ env.discord }}" ]; then
            cp "DerivedData/MinGW-${{ matrix.ARCH }}/Dependencies/onscrlib/lib/discord_game_sdk_${SUFFIX}.dll" ciout/
            files+=("discord_game_sdk_${SUFFIX}.dll")
          fi
          # Optional ANGLE and crash handler DLLs: dlls/ is 32-bit, dlls/x64/ is 64-bit.
          # Each zip carries only its own set, so both can be extracted into one folder.
          if [ "${{ matrix.ARCH }}" == "x86_64" ]; then
            mkdir -p ciout/dlls
            cp -r Resources/Windows/dlls/x64 ciout/dlls/x64
          else
            cp -r Resources/Windows/dlls ciout/dlls
            rm -rf ciout/dlls/x64
          fi
          files+=(dlls)
          cd ciout
          zip -qry "${ZIP_NAME}.zip" "${files[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ZIP_NAME }}
          path: ciout/${{ env.ZIP_NAME }}.zip
          if-no-files-found: error
          retention-days: 7

  Linux:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        BUILD_TYPE: ["debug", "release"]

    env:
      BUILD: ${{ github.run_number }}
      dev: ${{ matrix.BUILD_TYPE == 'debug' && '_dev' || '' }}
      cmd: ${{ matrix.BUILD_TYPE == 'release' && '--release-build --strip-binary' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm libreadline-dev libasound-dev libgl1-mesa-dev libegl1-mesa-dev libxrandr-dev python3-pip
          pip3 install meson ninja

      - name: Env setup
        run: |
          echo "Build number ${BUILD}"
          mkdir -p ciout
          echo "ZIP_NAME=onscripter-ru_linux64_r${BUILD}${dev}" >> "$GITHUB_ENV"

      - name: Configure
        run: ./configure ${{env.cmd}}

      - name: Build
        run: |
          make clean
          make -j"$(nproc)"
          mv DerivedData/Posix-x86_64/onscripter-ru ciout
          cd ciout
          zip -qry "${ZIP_NAME}.zip" onscripter-ru
          rm onscripter-ru

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ZIP_NAME }}
          path: ciout/${{ env.ZIP_NAME }}.zip
          if-no-files-found: error
          retention-days: 7

  # Disabled: the macos-11 runner no longer exists. Not part of the release until it is fixed.
  macOS:
    if: false
    runs-on: macos-11

    strategy:
      matrix:
        BUILD_TYPE: ["Debug", "Release"]

    env:
      BUILD: ${{ github.run_number }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      dev: ${{ matrix.BUILD_TYPE == 'Debug' && '_dbg' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          brew install yasm meson ninja

      - name: Env setup
        run: |
          echo "Build number ${BUILD}"
          mkdir -p ciout
          echo "ZIP_NAME=onscripter-ru_osx_r${BUILD}${dev}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO -target onscripter-ru-osx -configuration ${{ matrix.BUILD_TYPE }}
          mv build/${{ matrix.BUILD_TYPE }}/onscripter-ru-osx.app ciout
          cd ciout
          zip -qry "${ZIP_NAME}.zip" onscripter-ru-osx.app
          rm -rf onscripter-ru-osx.app

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ZIP_NAME }}
          path: ciout/${{ env.ZIP_NAME }}.zip
          if-no-files-found: error
          retention-days: 7

  # Publishes one release with every zip in a single step. Releases are immutable, so
  # nothing is published unless all build jobs pass, and pull requests only build.
  Release:
    needs: [Windows, Linux]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    env:
      BUILD: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: onscripter-ru_*
          path: ciout
          merge-multiple: true

      - name: Create release
        run: |
          ls -l ciout
          gh release create "z${BUILD}" ciout/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ONScripter-ru r${BUILD}" \
            --notes "Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME} (run ${GITHUB_RUN_ID})."
